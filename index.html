<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>財富自我循環實戰方案</title>
    <!-- 引入 Tailwind CSS (用於快速排版) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#0A2540',
                        'brand-gold': '#F5A623',
                        'brand-light': '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f3f4f6; }
        .hero-bg {
            background: linear-gradient(135deg, #0A2540 0%, #1a4a7b 100%);
        }
        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background-color: #F5A623;
            margin: 12px auto 0;
            border-radius: 2px;
        }
        /* 隱藏捲軸但可捲動 */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>

<body class="bg-gray-100 pb-24">
    <header class="hero-bg text-white text-center py-12 px-4 shadow-lg rounded-b-3xl">
        <div class="text-brand-gold font-bold tracking-widest text-sm mb-2">不只是賣保單，而是建立長期信任</div>
        <h1 class="text-3xl font-extrabold leading-tight mb-4">財富自我循環<br><span class="text-4xl text-brand-gold">實戰方案</span></h1>
        <p class="text-lg opacity-90 mb-6">學會<strong class="text-yellow-300">成交</strong>的方法，培養<strong class="text-yellow-300">服務</strong>的底氣</p>
        <div class="inline-block bg-white text-brand-blue font-bold py-2 px-6 rounded-full shadow-md">
            一套方法 ＋ 一個系統 ＝ 持續成交
        </div>
    </header>

    <div class="max-w-md mx-auto p-5">
        
        <!-- 👇 新增的圖片區塊 👇 -->
        <div class="mb-6 rounded-2xl shadow-xl overflow-hidden border-4 border-white">
            <img src="course-info.png" alt="財富自我循環實戰方案說明" class="w-full h-auto block">
        </div>
        <!-- 👆 新增結束 👆 -->
        
        <div class="bg-white p-6 rounded-2xl shadow-xl border-t-4 border-brand-gold relative overflow-hidden">
            <h2 class="text-xl font-bold mb-5 text-center text-brand-blue">包班專用報名表</h2>
            
            <!-- 步驟一：表單區塊 -->
            <form id="corpForm" class="space-y-4">
                <!-- 1. 新增：公司名稱 (必填) -->
                <div>
                    <label class="block text-sm font-bold text-gray-700">公司名稱 <span class="text-red-500">*</span></label>
                    <input type="text" id="companyName" required class="w-full p-3 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-brand-gold">
                </div>
                <!-- 2. 新增：單位名稱/代號 (必填) -->
                <div>
                    <label class="block text-sm font-bold text-gray-700">單位名稱/代號 <span class="text-red-500">*</span></label>
                    <input type="text" id="unitCode" required class="w-full p-3 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-brand-gold">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700">真實姓名 <span class="text-red-500">*</span></label>
                    <input type="text" id="name" required class="w-full p-3 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-brand-gold">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">手機 <span class="text-red-500">*</span></label>
                    <input type="tel" id="phone" required placeholder="0912345678" class="w-full p-3 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-brand-gold">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">Email <span class="text-red-500">*</span></label>
                    <input type="email" id="email" required class="w-full p-3 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-brand-gold">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">希望這堂課，能為您解決什麼問題？(選填)</label>
                    <textarea id="question" rows="3" placeholder="請簡述您的期待或遇到的問題" class="w-full p-3 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-brand-gold"></textarea>
                </div>
                
                <button type="submit" id="submitBtn" class="w-full bg-brand-blue hover:bg-blue-900 text-white p-4 rounded-xl font-bold mt-4 transition-all">
                    下一步：確認資料
                </button>
            </form>

            <!-- 步驟二：資料確認區塊 (預設隱藏) -->
            <div id="step-confirm" class="hidden space-y-4">
                <h3 class="font-bold text-brand-blue text-lg mb-2 border-b pb-2">請確認您的報名資料</h3>
                <div class="bg-gray-50 p-4 rounded-lg space-y-2 text-sm">
                    <!-- 將 w-24 改為 w-32，讓文字排版對齊 -->
                    <p><span class="text-gray-500 w-32 inline-block">公司名稱：</span><strong id="confirm-companyName"></strong></p>
                    <p><span class="text-gray-500 w-32 inline-block">單位名稱/代號：</span><strong id="confirm-unitCode"></strong></p>
                    <p><span class="text-gray-500 w-32 inline-block">姓名：</span><strong id="confirm-name"></strong></p>
                    <p><span class="text-gray-500 w-32 inline-block">手機：</span><strong id="confirm-phone"></strong></p>
                    <p><span class="text-gray-500 w-32 inline-block">Email：</span><strong id="confirm-email"></strong></p>
                    <div>
                        <span class="text-gray-500 block mb-1">希望解決的問題：</span>
                        <div id="confirm-question" class="bg-white p-2 border rounded text-gray-700 min-h-[3rem]"></div>
                    </div>
                </div>
                
                <div class="flex gap-3 mt-4">
                    <button type="button" id="backToEditBtn" class="w-1/3 bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold py-3 rounded-xl transition-colors">
                        返回修改
                    </button>
                    <button type="button" id="finalSubmitBtn" class="w-2/3 bg-brand-gold hover:bg-yellow-500 text-brand-blue font-bold py-3 rounded-xl transition-all shadow-md">
                        資料無誤，確認送出
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- 載入中遮罩層 (防重複點擊) -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-brand-blue bg-opacity-80 flex-col justify-center items-center z-[100] backdrop-blur-sm">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-brand-gold mb-4"></div>
        <p id="loadingText" class="text-white text-lg font-bold tracking-widest">資料傳送中，請稍候...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('corpForm');
            const stepConfirm = document.getElementById('step-confirm');
            const backToEditBtn = document.getElementById('backToEditBtn');
            const finalSubmitBtn = document.getElementById('finalSubmitBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            
            let finalDataToSubmit = {};

            // 攔截表單送出，進入確認畫面
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const companyName = document.getElementById('companyName').value.trim();
                const unitCode = document.getElementById('unitCode').value.trim();
                const name = document.getElementById('name').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const email = document.getElementById('email').value.trim();
                const question = document.getElementById('question').value.trim();

                // 嚴格格式驗證
                if (!/^[\u4e00-\u9fa5]+$/.test(name)) return alert("姓名格式錯誤：只能輸入純中文");
                if (!/^\d{10}$/.test(phone)) return alert("手機格式錯誤：必須為10碼數字");
                if (!email.includes('@')) return alert("Email 格式錯誤");

                // 將驗證過的資料存入全域變數
                finalDataToSubmit = { companyName, unitCode, name, phone, email, question };

                // 填入確認畫面
                document.getElementById('confirm-companyName').textContent = companyName;
                document.getElementById('confirm-unitCode').textContent = unitCode;
                document.getElementById('confirm-name').textContent = name;
                document.getElementById('confirm-phone').textContent = phone;
                document.getElementById('confirm-email').textContent = email;
                document.getElementById('confirm-question').textContent = question || "(未填寫)";

                // 切換畫面：隱藏表單，顯示確認區塊
                form.classList.add('hidden');
                stepConfirm.classList.remove('hidden');
            });

            // 返回修改按鈕邏輯
            backToEditBtn.addEventListener('click', () => {
                stepConfirm.classList.add('hidden');
                form.classList.remove('hidden');
            });

            // 最終確認送出邏輯
            finalSubmitBtn.addEventListener('click', async () => {
                finalSubmitBtn.disabled = true;
                backToEditBtn.disabled = true;
                
                // 顯示載入遮罩
                loadingOverlay.classList.remove('hidden');
                loadingOverlay.classList.add('flex');

                try {
                    // 呼叫 Google Apps Script API
                    const response = await fetch("https://script.google.com/macros/s/AKfycbxjqrWbYQmOtZ13VAs2mcdexCEsg2K703PfHSCT4aGmDVbn9gQg1EbTXfrhGND1QTZy6Q/exec", {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify(finalDataToSubmit)
                    });
                    
                    // 隱藏遮罩
                    loadingOverlay.classList.add('hidden');
                    loadingOverlay.classList.remove('flex');
                    
                    alert("🎉 報名成功！我們已收到您的資料。");
                    
                    // 重置流程
                    form.reset();
                    stepConfirm.classList.add('hidden');
                    form.classList.remove('hidden');
                    
                } catch (err) {
                    loadingOverlay.classList.add('hidden');
                    loadingOverlay.classList.remove('flex');
                    alert("【發送失敗】請確認網路連線或稍後再試。");
                } finally {
                    finalSubmitBtn.disabled = false;
                    backToEditBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
